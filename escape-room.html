const u=s=>Uint8Array.from(atob(s),ch=>ch.charCodeAt(0));
async function open(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},key,u(D.c));
  return new TextDecoder().decode(buf);
}
const KEY="basquiat-escape-pw";
function show(html){ document.open(); document.write(html); document.close(); }
async function tryPw(pw,silent){
  try{ const h=await open(pw); try{sessionStorage.setItem(KEY,pw);}catch(e){} show(h); return true; }
  catch(e){ if(!silent){ document.getElementById("err").textContent="Falsches Passwort. Die Tür bleibt zu."; } return false; }
}
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault(); const b=document.getElementById("go"); b.disabled=true;
  document.getElementById("err").textContent="";
  const ok=await tryPw(document.getElementById("pw").value.trim(),false);
  if(!ok) b.disabled=false;
});
if(!window.crypto||!crypto.subtle){ document.getElementById("err").textContent="Bitte öffnet die Seite über https oder als Datei in einem aktuellen Browser."; }
else { let s=null; try{s=sessionStorage.getItem(KEY);}catch(e){} if(s) tryPw(s,true); }
