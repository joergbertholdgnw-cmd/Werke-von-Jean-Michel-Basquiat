<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escape-Room: Basquiats Atelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f3e8; --ink:#141414; --yellow:#f6c700; --red:#e63323; --blue:#1e6fd9;
  --green:#2f9e44; --muted:#5b5b5b; --card:#ffffff;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:18px;line-height:1.5}
body{background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px);background-size:6px 6px;min-height:100vh}
h1,h2,h3,.marker{font-family:"Permanent Marker","Comic Sans MS","Chalkboard SE",cursive;font-weight:400;letter-spacing:.5px}
h1{font-size:2.3rem;margin:.2em 0}
h2{font-size:1.8rem;margin:.2em 0 .4em}
h3{font-size:1.25rem;margin:.6em 0 .3em}
.wrap{max-width:1020px;margin:0 auto;padding:16px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 16px;background:var(--ink);color:#fff}
header.top .brand{display:flex;align-items:center;gap:10px;font-family:"Permanent Marker",cursive;font-size:1.2rem}
header.top .stats{display:flex;gap:14px;font-weight:700;font-size:.95rem;flex-wrap:wrap}
header.top .stats span{background:#fff;color:var(--ink);padding:2px 10px;border-radius:4px}
.crown{display:inline-block;vertical-align:middle}
.card{background:var(--card);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:20px;margin:18px 0;position:relative}
.card.yellow{background:#fff6c9}
.card.note{background:#fffdf5;border-style:dashed;box-shadow:none}
.btn{font:inherit;font-weight:800;border:3px solid var(--ink);background:var(--yellow);color:var(--ink);padding:10px 18px;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .05s}
.btn:hover{transform:translate(-1px,-1px)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.secondary{background:#fff}
.btn.red{background:var(--red);color:#fff}
.btn.small{padding:5px 12px;font-size:.9rem;box-shadow:3px 3px 0 var(--ink)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
input[type=text],select{font:inherit;border:3px solid var(--ink);padding:8px 10px;background:#fff;max-width:100%}
input[type=text]{width:100%}
select{min-width:200px}
.hidden{display:none!important}
.feedback{margin-top:12px;font-weight:800;min-height:1.5em}
.feedback.ok{color:var(--green)}
.feedback.bad{color:var(--red)}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* map */
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;margin-top:10px}
.room-tile{border:3px solid var(--ink);background:#fff;padding:14px;cursor:pointer;box-shadow:5px 5px 0 var(--ink);text-align:left;font:inherit;color:inherit;position:relative;min-height:130px}
.room-tile .num{font-family:"Permanent Marker",cursive;font-size:2rem;line-height:1}
.room-tile .ttl{font-weight:800;margin-top:4px}
.room-tile .st{font-size:.9rem;color:var(--muted);margin-top:6px}
.room-tile.locked{background:#e9e6dc;cursor:not-allowed;opacity:.7;box-shadow:none}
.room-tile.done{background:#e3f5e6}
.room-tile .letter{position:absolute;right:12px;top:8px;font-family:"Permanent Marker",cursive;font-size:2.2rem;color:var(--red)}
.room-tile:nth-child(3n+1){transform:rotate(-1deg)}
.room-tile:nth-child(3n+2){transform:rotate(.8deg)}
.door-tile{background:var(--ink);color:#fff}
.door-tile.locked{background:#555;color:#ddd}
.lettersbar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.lettersbar .slot{width:46px;height:56px;border:3px solid var(--ink);background:#fff;display:flex;align-items:center;justify-content:center;font-family:"Permanent Marker",cursive;font-size:1.8rem;color:var(--red)}
/* info text */
.info p{margin:.4em 0}
.info .fact{background:var(--yellow);padding:0 4px}
.clip{display:block;flex:1 1 220px;background:#fff;border:2px solid var(--ink);padding:10px 12px;margin:6px;max-width:300px;box-shadow:3px 3px 0 rgba(0,0,0,.8);vertical-align:top}
.clip:nth-child(odd){transform:rotate(-1.5deg)}
.clip:nth-child(even){transform:rotate(1.2deg)}
.clip b{font-family:"Permanent Marker",cursive;font-weight:400;font-size:1.2rem}
/* quiz */
.q{margin:14px 0;padding:12px;border:2px solid var(--ink);background:#fff}
.q .opts{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.q label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:6px 8px;border:2px solid transparent}
.q label:hover{border-color:#ccc}
.q input[type=radio]{width:22px;height:22px;flex:0 0 auto;margin-top:3px;accent-color:var(--ink)}
/* graffiti wall */
.wall{background:#3a3a3a;background-image:linear-gradient(#444 2px,transparent 2px),linear-gradient(90deg,#444 2px,transparent 2px);background-size:80px 40px;padding:18px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center;border:3px solid var(--ink)}
.tag{font:inherit;font-weight:700;color:#fff;background:transparent;border:3px dashed rgba(255,255,255,.6);padding:10px 12px;max-width:290px;cursor:pointer;text-align:left}
.tag:nth-child(3n){color:#ffe066}
.tag:nth-child(3n+1){color:#9fd3ff}
.tag.sel{background:var(--yellow);color:var(--ink)!important;border-style:solid;border-color:#fff}
/* timeline */
.tl-pool,.tl-order{display:flex;flex-direction:column;gap:8px}
.tl-item{font:inherit;text-align:left;background:#fff;border:3px solid var(--ink);padding:8px 12px;cursor:pointer}
.tl-item.used{opacity:.35;cursor:default}
.tl-order .tl-item{background:#fff6c9;cursor:default}
.tl-order .tl-item .n{font-family:"Permanent Marker",cursive;margin-right:8px;color:var(--red)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
/* symbols */
.sym-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.sym{border:3px solid var(--ink);background:#fff;padding:12px;display:flex;flex-direction:column;gap:8px}
.sym .pic{height:90px;display:flex;align-items:center;justify-content:center;background:#fffdf5;border:2px dashed #999}
.sym select{width:100%;min-width:0}
/* gallery */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.frame{background:#fff;border:3px solid var(--ink);padding:10px;display:flex;flex-direction:column;gap:8px}
.frame .imgbox{background:#222;height:200px;display:flex;align-items:center;justify-content:center;cursor:zoom-in}
.frame img{max-width:100%;max-height:200px;display:block}
.frame select{width:100%;min-width:0;font-size:.95rem}
.desc-list{columns:2;column-gap:24px}
.desc-list li{break-inside:avoid;margin-bottom:8px}
/* lightbox */
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:50;cursor:zoom-out;padding:16px}
#lightbox img{max-width:100%;max-height:92vh;border:4px solid #fff}
/* detective */
.det{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start;margin:16px 0;padding:14px;border:3px solid var(--ink);background:#fff}
.det img{width:100%;display:block;border:2px solid var(--ink);cursor:zoom-in}
/* cloze */
.cloze{font-size:1.1rem;line-height:2.4}
.cloze select{min-width:150px;padding:4px 6px;font-size:1rem}
.hint{background:#e8f0ff;border-left:6px solid var(--blue);padding:10px 14px;margin-top:12px}
.success{background:#e3f5e6;border:3px solid var(--green);padding:16px;margin-top:14px}
.success .big{font-family:"Permanent Marker",cursive;font-size:3rem;color:var(--red);line-height:1}
.cert{text-align:center;background:#fff;border:6px double var(--ink);padding:28px;box-shadow:8px 8px 0 var(--ink)}
.cert h1{font-size:2.6rem}
.foot{font-size:.8rem;color:var(--muted);margin:30px 0 10px;border-top:1px solid #ccc;padding-top:10px}
.tag-sm{display:inline-block;background:var(--ink);color:#fff;padding:1px 8px;font-size:.85rem;font-weight:700;margin-bottom:6px}
.strike{text-decoration:line-through;text-decoration-thickness:4px}
@media (max-width:700px){
  html,body{font-size:16px}
  .cols,.det{grid-template-columns:1fr}
  .desc-list{columns:1}
  h1{font-size:1.8rem}
}
@media print{header.top,.btn{display:none}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><svg class="crown" width="42" height="30" viewBox="0 0 84 60" aria-hidden="true"><path d="M6 50 L10 12 L26 34 L40 6 L54 34 L72 10 L76 50 Z" fill="none" stroke="#f6c700" stroke-width="6" stroke-linejoin="round"/><path d="M4 54 L80 52" stroke="#f6c700" stroke-width="6" stroke-linecap="round"/></svg> Basquiats Atelier</div>
  <div class="stats"><span id="teamLbl">Team: –</span><span>⏱ <b id="timer">00:00</b></span><span>💡 Tipps: <b id="hintCount">0</b></span></div>
</header>

<main class="wrap" id="app"></main>

<div id="lightbox" class="hidden" role="dialog" aria-label="Bild vergrößert"><img alt=""></div>

<div class="wrap foot">
  Abbildungen: Werke von Jean-Michel Basquiat, © Estate of Jean-Michel Basquiat. Die Bilddateien sind nicht Teil dieses Repositorys und werden nur lokal zur Veranschaulichung im Unterricht genutzt (§ 60a UrhG).
  · <button class="btn small secondary" id="resetBtn">Spiel neu starten</button>
</div>

<script>
const IMG = {
  ohnetitel1981: "bilder/ohnetitel1981.jpg",
  johnnypump: "bilder/johnnypump.jpg",
  krone: "bilder/krone.jpg",
  hollywood: "bilder/hollywood.jpg",
  geschichte: "bilder/geschichte.jpg",
  polizist: "bilder/polizist.jpg",
  ohnetitel1982: "bilder/ohnetitel1982.jpg",
  prokopf: "bilder/prokopf.jpg"
};

const CROWN = (c="#141414",w=70)=>`<svg width="${w}" height="${w*0.72}" viewBox="0 0 84 60" aria-label="Krone"><path d="M6 50 L10 12 L26 34 L40 6 L54 34 L72 10 L76 50 Z" fill="none" stroke="${c}" stroke-width="6" stroke-linejoin="round"/><path d="M4 54 L80 52" stroke="${c}" stroke-width="6" stroke-linecap="round"/></svg>`;
const SKULL = `<svg width="70" height="78" viewBox="0 0 70 78" aria-label="Schädel"><path d="M35 4 C14 4 5 20 6 36 C7 46 12 50 14 54 L16 66 L54 66 L56 54 C58 50 63 46 64 36 C65 20 56 4 35 4 Z" fill="#fff" stroke="#141414" stroke-width="4"/><circle cx="23" cy="34" r="8" fill="#141414"/><circle cx="47" cy="34" r="8" fill="#141414"/><path d="M35 42 L30 52 L40 52 Z" fill="#141414"/><path d="M22 66 L22 74 M30 66 L30 74 M40 66 L40 74 M48 66 L48 74" stroke="#141414" stroke-width="4"/></svg>`;

/* ---------------- State ---------------- */
const STORE_KEY = "basquiat-escape-v1";
let S = load() || {team:"", started:null, elapsed:0, hints:0, solved:{}, finished:null, current:"start"};
function load(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)); }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){} }

/* ---------------- Rooms ---------------- */
const ROOMS = [
 {id:"r1", num:1, title:"Brooklyn, 1960", sub:"Kindheit", letter:"T",
  hint:"Lest den Infotext noch einmal genau. Die Antworten stehen alle darin, auch der Name des Buches."},
 {id:"r2", num:2, title:"Die Wände von New York", sub:"SAMO©", letter:"K",
  hint:"Genau vier Sprüche sind richtig. Basquiat hat nie an einer Kunstakademie studiert und SAMO© schrieb Sprüche, keine Comic-Bilder."},
 {id:"r3", num:3, title:"Zeitreise", sub:"Lebenslauf ordnen", letter:"E",
  hint:"Achtet auf die Jahreszahlen auf den Zeitungsschnipseln. Geburt ist 1960, der Unfall war, als er sieben Jahre alt war."},
 {id:"r4", num:4, title:"Die Geheimsprache", sub:"Zeichen & Symbole", letter:"L",
  hint:"Das © ist das Copyright-Zeichen: Es sagt „Das gehört mir!“. Durchgestrichene Wörter will man erst recht lesen."},
 {id:"r5", num:5, title:"Die Galerie", sub:"Bilder erkennen", letter:"T",
  hint:"Schaut auf Wörter in den Bildern: „PER CAPITA“ heißt „pro Kopf“, „HOLLYWOOD AFRICANS“ steht groß oben. Der Polizist trägt eine Mütze."},
 {id:"r6", num:6, title:"Bilddetektive", sub:"Genau hinschauen", letter:"E",
  hint:"Klickt auf die Bilder, um sie zu vergrößern. Das Wort auf der Hose kennt man auch von Boxhandschuhen."},
 {id:"r7", num:7, title:"Ruhm & Vermächtnis", sub:"Die letzten Jahre", letter:"S",
  hint:"Basquiat war 27 Jahre alt, als er starb. Sein berühmter Freund war ein Pop-Art-Künstler mit weißen Haaren."}
];
const SOLUTION = "SKELETT";

/* ---------------- Timer ---------------- */
let tick=null;
function startTimer(){
  if(tick) return;
  tick=setInterval(()=>{ if(S.started && !S.finished){ S.elapsed++; if(S.elapsed%5===0) save(); renderStats(); } },1000);
}
function fmt(sec){ const m=Math.floor(sec/60), s=sec%60; return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0"); }
function renderStats(){
  document.getElementById("timer").textContent = fmt(S.elapsed);
  document.getElementById("hintCount").textContent = S.hints;
  document.getElementById("teamLbl").textContent = "Team: " + (S.team || "–");
}

/* ---------------- Helpers ---------------- */
const app = document.getElementById("app");
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function go(view){ S.current=view; save(); render(); window.scrollTo(0,0); }
function unlockedIndex(){ let i=0; while(i<ROOMS.length && S.solved[ROOMS[i].id]) i++; return i; }
function fb(el, ok, msg){
  el.className = "feedback " + (ok?"ok":"bad");
  el.textContent = msg;
  if(!ok){ el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
}
function roomHeader(r){
  return `<div class="row" style="justify-content:space-between">
    <button class="btn small secondary" onclick="go('map')">← Zum Lageplan</button>
    <span class="tag-sm">Raum ${r.num} von ${ROOMS.length}</span></div>
    <h1>${r.num}. ${r.title}</h1>`;
}
function hintBox(r){
  return `<div class="row" style="margin-top:14px"><button class="btn small secondary" id="hintBtn">💡 Tipp anzeigen</button></div>
  <div class="hint hidden" id="hintTxt">${r.hint}</div>`;
}
function wireHint(r){
  const b=document.getElementById("hintBtn"); if(!b) return;
  b.onclick=()=>{ const t=document.getElementById("hintTxt");
    if(t.classList.contains("hidden")){ t.classList.remove("hidden"); if(!S["hint_"+r.id]){ S["hint_"+r.id]=1; S.hints++; save(); renderStats(); } } };
}
function solved(r){
  S.solved[r.id]=true; save();
  const box=document.getElementById("solvedBox");
  box.innerHTML = `<div class="success"><div class="row" style="gap:20px"><div class="big">${r.letter}</div>
   <div><b>Geschafft!</b> Ihr habt einen Buchstaben für das Türschloss gefunden: <b>${r.letter}</b>.<br>Schreibt ihn euch auf!</div></div>
   <div class="row" style="margin-top:12px"><button class="btn" onclick="go('map')">Weiter zum Lageplan →</button></div></div>`;
  box.scrollIntoView({behavior:"smooth",block:"center"});
}
function zoomable(){
  document.querySelectorAll("[data-zoom]").forEach(el=>{
    el.onclick=()=>{ const lb=document.getElementById("lightbox"); lb.querySelector("img").src=el.dataset.zoom; lb.querySelector("img").alt=el.dataset.alt||""; lb.classList.remove("hidden"); };
  });
}
document.getElementById("lightbox").onclick=()=>document.getElementById("lightbox").classList.add("hidden");
document.addEventListener("keydown",e=>{ if(e.key==="Escape") document.getElementById("lightbox").classList.add("hidden"); });
document.getElementById("resetBtn").onclick=()=>{
  if(confirm("Wirklich alles löschen und neu starten?")){ try{localStorage.removeItem(STORE_KEY);}catch(e){} S={team:"",started:null,elapsed:0,hints:0,solved:{},finished:null,current:"start"}; render(); renderStats(); }
};

/* ---------------- Views ---------------- */
function render(){
  const v=S.current;
  if(v==="start") return viewStart();
  if(v==="map") return viewMap();
  if(v==="door") return viewDoor();
  if(v==="cert") return viewCert();
  const r=ROOMS.find(x=>x.id===v);
  if(r){ ({r1,r2,r3,r4,r5,r6,r7})[r.id](r); wireHint(r); zoomable(); if(S.solved[r.id]) showAlreadySolved(r); }
}
function showAlreadySolved(r){
  const box=document.getElementById("solvedBox");
  if(box) box.innerHTML=`<div class="success"><div class="row" style="gap:20px"><div class="big">${r.letter}</div><div>Diesen Raum habt ihr schon gelöst. Euer Buchstabe: <b>${r.letter}</b></div></div><div class="row" style="margin-top:12px"><button class="btn" onclick="go('map')">Zum Lageplan →</button></div></div>`;
}

function viewStart(){
  app.innerHTML = `
  <div class="card yellow">
    <div class="row" style="gap:18px;align-items:flex-start">
      <div>${CROWN("#141414",90)}</div>
      <div style="flex:1;min-width:240px">
        <h1>Eingeschlossen im Atelier!</h1>
        <p>New York, 1983. Ihr besucht das Atelier des jungen Malers <b>Jean-Michel Basquiat</b>. Überall liegen Farbtöpfe, Zeichnungen und Bücher herum. Plötzlich fällt die Tür ins Schloss!</p>
        <p>Das Türschloss braucht ein <b>geheimes Lösungswort</b>. In jedem der <b>7 Räume</b> findet ihr einen Buchstaben, wenn ihr das Rätsel löst. Wer alle Buchstaben hat, kann die Tür öffnen.</p>
      </div>
    </div>
  </div>
  <div class="card">
    <h2>So spielt ihr</h2>
    <ul>
      <li>Ihr arbeitet <b>zu zweit</b> an einem Gerät. Wechselt euch beim Klicken ab und lest die Texte gemeinsam.</li>
      <li>Lest in jedem Raum zuerst den <b>Infotext</b> oder schaut die <b>Bilder</b> genau an. Dann löst ihr das Rätsel.</li>
      <li>Schreibt jeden gefundenen Buchstaben auf einen Zettel.</li>
      <li>Wenn ihr nicht weiterkommt, gibt es einen <b>💡 Tipp</b>. Jeder Tipp wird gezählt.</li>
      <li>Ihr habt etwa <b>45 Minuten</b> Zeit. Die Uhr oben läuft mit.</li>
    </ul>
    <h3>Wie heißt euer Team?</h3>
    <div class="row"><input type="text" id="teamIn" maxlength="40" placeholder="z. B. Lena & Ali" style="max-width:380px" value="${esc(S.team)}">
    <button class="btn" id="startBtn">Los geht’s!</button></div>
    <div class="feedback" id="fbStart"></div>
  </div>`;
  document.getElementById("startBtn").onclick=()=>{
    const t=document.getElementById("teamIn").value.trim();
    if(t.length<2) return fb(document.getElementById("fbStart"),false,"Bitte gebt euren Teamnamen ein.");
    S.team=t; if(!S.started) S.started=Date.now(); save(); renderStats(); startTimer(); go("map");
  };
  document.getElementById("teamIn").addEventListener("keydown",e=>{ if(e.key==="Enter") document.getElementById("startBtn").click(); });
}

function viewMap(){
  const ui=unlockedIndex();
  const tiles = ROOMS.map((r,i)=>{
    const done=!!S.solved[r.id], locked=i>ui;
    return `<button class="room-tile ${done?"done":""} ${locked?"locked":""}" ${locked?"disabled":""} data-room="${r.id}">
      <div class="num">${r.num}</div><div class="ttl">${r.title}</div><div class="st">${r.sub}<br>${done?"✔ gelöst":locked?"🔒 verschlossen":"➜ jetzt betreten"}</div>
      ${done?`<div class="letter">${r.letter}</div>`:""}</button>`;
  }).join("");
  const allDone = ui>=ROOMS.length;
  const letters = ROOMS.map(r=>`<div class="slot">${S.solved[r.id]?r.letter:""}</div>`).join("");
  app.innerHTML = `
    <h1>Lageplan des Ateliers</h1>
    <p>Die Räume öffnen sich nacheinander. Löst ein Rätsel, dann geht die nächste Tür auf.</p>
    <div class="card note"><b>Eure Buchstaben bisher:</b><div class="lettersbar">${letters}</div></div>
    <div class="map">${tiles}
      <button class="room-tile door-tile ${allDone?"":"locked"}" ${allDone?"":"disabled"} data-room="door">
        <div class="num">🚪</div><div class="ttl">Die Ateliertür</div><div class="st" style="color:inherit">${allDone?"➜ Lösungswort eingeben":"🔒 erst alle 7 Räume lösen"}</div></button>
    </div>`;
  app.querySelectorAll("[data-room]").forEach(b=>b.onclick=()=>{ if(!b.disabled) go(b.dataset.room); });
}

/* ---- Raum 1: Kindheit ---- */
function r1(r){
  const Q=[
    {q:"Wann und wo wurde Jean-Michel Basquiat geboren?", o:["1960 in Brooklyn, New York","1972 in Paris","1955 in Los Angeles"], a:0},
    {q:"Woher stammte seine Familie?", o:["Der Vater aus Italien, die Mutter aus Kanada","Der Vater aus Haiti, die Mutter aus einer Familie aus Puerto Rico","Beide aus Deutschland"], a:1},
    {q:"Mit sieben Jahren hatte er einen schweren Unfall. Was schenkte ihm seine Mutter im Krankenhaus?", o:["Einen Farbkasten","Ein Anatomie-Buch über den menschlichen Körper („Gray’s Anatomy“)","Eine Spraydose"], a:1},
    {q:"Warum ist dieses Geschenk für seine Kunst wichtig?", o:["Er malte danach nur noch Tiere","Später tauchen Knochen, Schädel und Körperteile oft in seinen Bildern auf","Er wurde dadurch Arzt"], a:1}
  ];
  app.innerHTML = roomHeader(r) + `
  <div class="card info">
    <span class="tag-sm">Infotext</span>

    <p>Die Buchstaben sind aber <b>durcheinander</b>! Bringt sie in die richtige Reihenfolge. Ein Hinweis: Basquiat kannte es aus seinem Anatomie-Buch, und es steckt in jedem von uns.</p>
    <div class="row"><input type="text" id="code" maxlength="12" placeholder="Lösungswort" style="max-width:280px;text-transform:uppercase;font-family:'Permanent Marker',cursive;font-size:1.4rem" autocomplete="off">
    <button class="btn red" id="open">Tür öffnen</button></div>
    <div class="feedback" id="fb"></div>
  </div>`;
  const tryOpen=()=>{
    const v=document.getElementById("code").value.trim().toUpperCase();
    if(v===SOLUTION){ S.finished=Date.now(); save(); go("cert"); }
    else fb(document.getElementById("fb"),false,"Die Tür bleibt zu. Versucht eine andere Reihenfolge!");
  };
  document.getElementById("open").onclick=tryOpen;
  document.getElementById("code").addEventListener("keydown",e=>{ if(e.key==="Enter") tryOpen(); });
}

function viewCert(){
  app.innerHTML = `
  <div class="cert">
    ${CROWN("#e63323",110)}
    <h1>Ausbruch geschafft!</h1>
    <p style="font-size:1.2rem">Team <b>${esc(S.team)}</b> hat das Lösungswort gefunden:</p>
    <div class="marker" style="font-size:3.2rem;color:#e63323;letter-spacing:6px">SKELETT</div>
    <p>Zeit: <b>${fmt(S.elapsed)}</b> · Benutzte Tipps: <b>${S.hints}</b></p>
    <p>Ihr seid jetzt Basquiat-Expertinnen und -Experten! ${CROWN("#141414",36)}</p>
  </div>
  <div class="card yellow">
    <h2>Und jetzt?</h2>
    <p>Zeigt diese Seite eurer Lehrkraft. Gleich arbeitet ihr selbst kreativ mit einem Bild von Basquiat. Und das Lösungswort ist kein Zufall: In den nächsten Stunden malt ihr <b>ein wildes Skelett im Stil von Basquiat</b>, mit Krone, Zeichen und Wörtern.</p>
    <p><b>Bis alle fertig sind:</b> Sucht euch euer Lieblingsbild aus Raum 5 aus. Schreibt drei Wörter auf, die zeigen, wie das Bild auf euch wirkt.</p>
  </div>`;
}

/* Fehlende Bilder: Platzhalter anzeigen */
document.addEventListener("error",e=>{
  const im=e.target; if(!(im instanceof HTMLImageElement) || im.dataset.missing) return;
  im.dataset.missing="1";
  const file=(im.getAttribute("src")||"").split("/").pop();
  const ph=document.createElement("div");
  ph.style.cssText="background:#fffdf5;border:2px dashed #999;color:#555;padding:14px;font-size:.9rem;text-align:center;min-height:140px;display:flex;align-items:center;justify-content:center;width:100%";
  ph.innerHTML="Bild fehlt.<br>Lege die Datei <b>bilder/"+file+"</b> neben diese HTML-Datei.";
  im.replaceWith(ph);
},true);

/* ---------------- Init ---------------- */
renderStats();
if(S.started && !S.finished) startTimer();
render();
</script>
